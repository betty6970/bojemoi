{{ define "title" }}{{ .Site.Title }}{{ end }}
{{ define "main" }}
  {{ .Content }}
  <h2>Articles</h2>
  {{ range site.RegularPages }}
  <article>
    <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
    <time>{{ .Date.Format "2 January 2006" }}</time>
    <p>{{ .Summary }}</p>
  </article>
  {{ end }}
{{ end }}
