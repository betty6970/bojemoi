{{ define "title" }}{{ .Title }} - {{ .Site.Title }}{{ end }}
{{ define "main" }}
  <h2>{{ .Title }}</h2>
  {{ .Content }}
  {{ range .Pages }}
  <article>
    <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
    <time>{{ .Date.Format "2 January 2006" }}</time>
    <p>{{ .Summary }}</p>
  </article>
  {{ end }}
{{ end }}
